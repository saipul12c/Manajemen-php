<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" height="100%">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf8" />
      <stop offset="100%" stop-color="#fdfbf4" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
  </defs>

  <!-- Background Kertas Ijazah -->
  <rect x="10" y="10" width="880" height="620" rx="12" fill="url(#paperGrad)" stroke="#d97706" stroke-width="3"/>
  <rect x="25" y="25" width="850" height="590" rx="8" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="35" y="35" width="830" height="570" rx="6" fill="none" stroke="#d97706" stroke-width="0.8"/>

  <!-- Ornamen Sudut -->
  <circle cx="45" cy="45" r="8" fill="#d97706"/>
  <circle cx="855" cy="45" r="8" fill="#d97706"/>
  <circle cx="45" cy="595" r="8" fill="#d97706"/>
  <circle cx="855" cy="595" r="8" fill="#d97706"/>

  <!-- Garuda / Simbol Atas -->
  <circle cx="450" cy="90" r="32" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <path d="M450 70 L460 85 L475 88 L463 99 L467 114 L450 105 L433 114 L437 99 L425 88 L440 85 Z" fill="#d97706"/>

  <!-- Header -->
  <text x="450" y="145" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#78350f" letter-spacing="3">KEMENTERIAN PENDIDIKAN, KEBUDAYAAN, RISET, DAN TEKNOLOGI</text>
  <text x="450" y="165" text-anchor="middle" font-family="'Times New Roman', serif" font-size="12" fill="#92400e" letter-spacing="2">REPUBLIK INDONESIA</text>
  
  <text x="450" y="210" text-anchor="middle" font-family="'Times New Roman', serif" font-size="34" font-weight="bold" fill="#1e293b" letter-spacing="6">I J A Z A H</text>
  <text x="450" y="235" text-anchor="middle" font-family="'Times New Roman', serif" font-size="15" font-weight="bold" fill="#334155">SEKOLAH MENENGAH ATAS (SMA)</text>
  <text x="450" y="255" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#b45309">NOMOR SERI: DN-01/M-SMA/13/0089214</text>

  <!-- Isi Keterangan -->
  <text x="450" y="295" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" fill="#334155">Kepala Sekolah Menengah Atas menerangkan bahwa:</text>
  
  <text x="450" y="340" text-anchor="middle" font-family="'Times New Roman', serif" font-size="24" font-weight="bold" fill="#0f172a">MUHAMMAD FAJAR PRATAMA</text>
  <line x1="280" y1="348" x2="620" y2="348" stroke="#334155" stroke-width="1.2"/>
  
  <text x="450" y="375" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#475569">Nomor Induk Siswa Nasional (NISN): 0041829301</text>
  <text x="450" y="400" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" fill="#334155">Telah menyelesaikan seluruh program pembelajaran dan dinyatakan:</text>
  
  <rect x="360" y="415" width="180" height="36" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="450" y="439" text-anchor="middle" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#92400e" letter-spacing="3">L U L U S</text>

  <text x="450" y="475" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13" fill="#475569">dengan capaian hasil evaluasi belajar Memuaskan pada Tahun Pelajaran 2023/2024.</text>

  <!-- Titimangsa & Tanda Tangan Asli -->
  <text x="680" y="520" text-anchor="middle" font-family="'Times New Roman', serif" font-size="12" fill="#334155">Jakarta, 20 Juni 2024</text>
  <text x="680" y="535" text-anchor="middle" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#1e293b">Kepala Sekolah,</text>

  <!-- Garis TTD & Nama -->
  <path d="M 620,560 Q 640,545 660,565 T 700,555 T 740,570" fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round"/>
  <text x="680" y="590" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" text-decoration="underline" fill="#0f172a">Dr. H. Bambang Sudirman, M.Pd</text>
  <text x="680" y="605" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#475569">NIP. 19750812 199903 1 002</text>

  <!-- Cap Medali Emas Kiri -->
  <circle cx="200" cy="550" r="38" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="200" cy="550" r="32" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="200" y="546" text-anchor="middle" font-family="'Times New Roman', serif" font-size="9" font-weight="bold" fill="#78350f">KEMENTERIAN</text>
  <text x="200" y="558" text-anchor="middle" font-family="'Times New Roman', serif" font-size="8" font-weight="bold" fill="#92400e">PENDIDIKAN</text>
</svg>
