<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradPresensi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="glowPresensi" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradPresensi)"/>

  <!-- Inner Border Glow -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Center QR & Scan Viewfinder -->
  <g filter="url(#glowPresensi)">
    <!-- QR Reticle / Viewfinder Corners -->
    <path d="M 110 170 L 110 130 A 20 20 0 0 1 130 110 L 170 110" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <path d="M 342 110 L 382 110 A 20 20 0 0 1 402 130 L 402 170" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <path d="M 402 312 L 402 352 A 20 20 0 0 1 382 372 L 342 372" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <path d="M 170 372 L 130 372 A 20 20 0 0 1 110 352 L 110 312" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

    <!-- Central QR Card -->
    <rect x="146" y="146" width="220" height="190" rx="20" fill="#0f172a" stroke="#10b981" stroke-width="4"/>

    <!-- QR Corner Blocks -->
    <!-- Top-Left -->
    <rect x="170" y="170" width="50" height="50" rx="8" fill="url(#qrGrad)"/>
    <rect x="180" y="180" width="30" height="30" rx="4" fill="#0f172a"/>
    <rect x="188" y="188" width="14" height="14" rx="2" fill="url(#qrGrad)"/>

    <!-- Top-Right -->
    <rect x="292" y="170" width="50" height="50" rx="8" fill="url(#qrGrad)"/>
    <rect x="302" y="180" width="30" height="30" rx="4" fill="#0f172a"/>
    <rect x="310" y="188" width="14" height="14" rx="2" fill="url(#qrGrad)"/>

    <!-- Bottom-Left -->
    <rect x="170" y="262" width="50" height="50" rx="8" fill="url(#qrGrad)"/>
    <rect x="180" y="272" width="30" height="30" rx="4" fill="#0f172a"/>
    <rect x="188" y="280" width="14" height="14" rx="2" fill="url(#qrGrad)"/>

    <!-- Laser Scanning Line -->
    <line x1="126" y1="230" x2="386" y2="230" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <circle cx="256" cy="230" r="8" fill="#ffffff"/>

    <!-- Verified Attendance Checkmark Badge -->
    <g transform="translate(325, 275)">
      <circle cx="35" cy="35" r="38" fill="#10b981" stroke="#ffffff" stroke-width="5"/>
      <path d="M 22 35 L 31 44 L 49 26" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Title Badge -->
  <rect x="166" y="420" width="180" height="42" rx="21" fill="#0f172a" fill-opacity="0.9" stroke="#34d399" stroke-width="3"/>
  <text x="256" y="447" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="3">PRESENSI</text>
</svg>
