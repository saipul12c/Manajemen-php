<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradCBT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradCBT)"/>

  <!-- Subtle Inner Border Glow -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Center Shield / Exam Sheet Emblem -->
  <g filter="url(#glow)">
    <!-- Computer Monitor / Exam Frame -->
    <rect x="96" y="96" width="320" height="230" rx="24" fill="#0f172a" stroke="#60a5fa" stroke-width="6"/>
    <!-- Screen Inner Header -->
    <rect x="102" y="102" width="308" height="38" rx="18" fill="#1e293b"/>
    <circle cx="128" cy="121" r="6" fill="#ef4444"/>
    <circle cx="148" cy="121" r="6" fill="#f59e0b"/>
    <circle cx="168" cy="121" r="6" fill="#10b981"/>
    
    <!-- Checklist items inside exam screen -->
    <rect x="130" y="165" width="40" height="12" rx="6" fill="#38bdf8"/>
    <rect x="185" y="165" width="180" height="12" rx="6" fill="#475569"/>
    
    <rect x="130" y="195" width="40" height="12" rx="6" fill="#38bdf8"/>
    <rect x="185" y="195" width="150" height="12" rx="6" fill="#475569"/>

    <rect x="130" y="225" width="40" height="12" rx="6" fill="#38bdf8"/>
    <rect x="185" y="225" width="195" height="12" rx="6" fill="#475569"/>

    <rect x="130" y="255" width="40" height="12" rx="6" fill="#38bdf8"/>
    <rect x="185" y="255" width="130" height="12" rx="6" fill="#475569"/>

    <!-- Monitor Stand -->
    <path d="M 220 326 L 206 376 L 306 376 L 292 326 Z" fill="#334155"/>
    <rect x="176" y="376" width="160" height="18" rx="9" fill="#475569"/>

    <!-- Golden Pencil / Stylus Overlay -->
    <g transform="translate(320, 260) rotate(45)">
      <rect x="0" y="0" width="36" height="140" rx="8" fill="#f59e0b" stroke="#ffffff" stroke-width="4"/>
      <polygon points="0,0 18,-36 36,0" fill="#fbbf24" stroke="#ffffff" stroke-width="4"/>
      <polygon points="12,-24 18,-36 24,-24" fill="#1e293b"/>
      <rect x="0" y="115" width="36" height="25" rx="4" fill="#ec4899"/>
    </g>
  </g>

  <!-- Title Badge -->
  <rect x="166" y="420" width="180" height="42" rx="21" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="3"/>
  <text x="256" y="447" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="3">CBT UJIAN</text>
</svg>
